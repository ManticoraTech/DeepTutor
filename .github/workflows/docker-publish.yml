name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: manticoratech/deeptutor

jobs:
  build:
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=,enable=${{ github.ref_type == 'branch' }}

      - name: Get git version
        id: version
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.version }}
          no-cache: true
          provenance: false
          push: true

      - name: Output image info
        run: |
          echo "Image built and pushed:"
          echo "  ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "  Digest: ${{ steps.build.outputs.digest }}"

      - name: Notify Keel
        if: success()
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | cut -d: -f2)
          curl -X POST https://keel.manticora.tech/v1/webhooks/native \
            -H "Content-Type: application/json" \
            -d '{"name": "ghcr.io/${{ env.IMAGE_NAME }}", "tag": "'$TAG'", "digest": "${{ steps.build.outputs.digest }}"}'